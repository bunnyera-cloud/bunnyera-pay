# =============================================================================
# BunnyEra Pay —— logrotate 配置
#
# 仓库路径：
#   /www/wwwroot/bunnyera-pay/deploy/logrotate.conf
# 系统落地（符号链接，方便以后跟仓库一起更新）：
#   /etc/logrotate.d/bunnyera-pay
#
# 统一策略：
#   daily        每天切割一次
#   rotate 14    保留 14 天
#   compress     切割后的旧日志自动 gzip
#   delaycompress  最新一份旧日志先不压，方便排障
#   missingok    文件暂时不存在也不报错
#   notifempty   空文件不轮转
#
# 应用日志用 copytruncate：先复制再清空原文件。
#   systemd 的 StandardOutput=append 会一直拿着同一个 fd，
#   如果 rename 而不清空，进程会继续往已轮转的 inode 写，磁盘还是会涨。
#   copytruncate 不需要重启 bunnyera-pay。
#
# Nginx 日志在 postrotate 里 reload（比 restart 更安全）：
#   让 Nginx 重新打开日志句柄。reload 不中断已建立的 HTTPS 连接。
#
# 校验语法（不会真的切日志）：
#   sudo logrotate -d /etc/logrotate.d/bunnyera-pay
# 强制立刻轮转一次（确认配置后用）：
#   sudo logrotate -f /etc/logrotate.d/bunnyera-pay
# =============================================================================

# ---------- 应用日志：Next.js / systemd 重定向 ----------
# 对应 bunnyera-pay.service 里的 app.log / app.err.log
# 以及本仓库 crontab 追加的 health-check.log / backup-db.log
/www/wwwroot/bunnyera-pay/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
    su bunnyera bunnyera
}

# ---------- Nginx 访问 / 错误日志（宝塔 / aaPanel 常见路径）----------
# 若实际文件名不同，用下面命令核对后改路径：
#   ls -l /www/wwwlogs/ | grep -i bunnyera
#   ls -l /www/wwwlogs/ | grep -i pay
/www/wwwlogs/pay.bunnyera.com.log
/www/wwwlogs/pay.bunnyera.com.error.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    sharedscripts
    postrotate
        # reload 让 Nginx 重新打开日志文件；不要用 restart。
        if [ -x /usr/sbin/nginx ]; then
            /usr/sbin/nginx -s reload >/dev/null 2>&1 || true
        elif command -v systemctl >/dev/null 2>&1; then
            systemctl reload nginx >/dev/null 2>&1 || true
        fi
    endscript
}

# ---------- Nginx 标准路径（站点日志不在 /www/wwwlogs 时启用）----------
/var/log/nginx/pay.bunnyera.com.access.log
/var/log/nginx/pay.bunnyera.com.error.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    sharedscripts
    postrotate
        if [ -x /usr/sbin/nginx ]; then
            /usr/sbin/nginx -s reload >/dev/null 2>&1 || true
        elif command -v systemctl >/dev/null 2>&1; then
            systemctl reload nginx >/dev/null 2>&1 || true
        fi
    endscript
}
