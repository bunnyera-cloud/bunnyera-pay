<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · BunnyEra Pay</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui.css"></head><body><main class="auth-shell"><section class="auth-brand"><div class="brand-content"><div class="brand-mark"><span class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>BunnyEra Pay</div><h1>管理每一个主体，<br>看清每一笔收款。</h1><p>BUNNYERA LLC 旗下多商户支付管理软件。统一管理企业主体、部门、产品、支付渠道、收款码、订单和对账。</p><div class="feature-row"><span class="feature-chip">多商户隔离</span><span class="feature-chip">聚合收银台</span><span class="feature-chip">部门级对账</span><span class="feature-chip">审计留痕</span></div></div><div class="brand-foot"><span>© 2026 BUNNYERA LLC</span><span>Software, not a bank</span><span>Secure merchant operations</span></div></section><section class="auth-main"><div class="auth-card"><span class="eyebrow">Secure access</span><h2>欢迎回来</h2><p class="muted">登录 BunnyEra Pay 管理平台</p><form id="login"><label>登录身份<select id="role"><option value="platform">平台管理员</option><option value="merchant">商户管理员</option></select></label><label>安全令牌<input id="token" type="password" autocomplete="current-password" placeholder="输入管理员令牌" required></label><button class="primary-btn">安全登录</button></form><div class="auth-actions"><a href="/merchant-register.html">注册企业商户</a><a href="/">返回收银台</a></div><div class="security-note">令牌仅保存在当前浏览器会话中。不要通过聊天、截图或邮件发送管理员令牌。</div><div id="message"></div></div></section></main><script>const form=document.querySelector('#login'),token=document.querySelector('#token'),role=document.querySelector('#role'),message=document.querySelector('#message');form.onsubmit=async e=>{e.preventDefault();message.innerHTML='<div class="result">正在验证…</div>';if(role.value==='merchant'){message.innerHTML='<div class="result">商户独立账号登录将在下一阶段启用。当前请使用平台管理员入口，或先提交企业注册。</div>';return}const r=await fetch('/api/admin/platform',{headers:{authorization:'Bearer '+token.value}});if(!r.ok){message.innerHTML='<div class="result error">令牌无效，请重新检查。</div>';return}sessionStorage.setItem('bunnyeraPlatformToken',token.value);location.href='/platform.html'};</script></body></html>
