<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业档案 · BunnyEra Pay</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui.css"></head><body><main class="wrap wide"><section class="card"><div class="heading"><div><span class="pill">COMPANY PROFILE</span><h1 id="title">企业档案</h1><p class="muted">营业执照、支付渠道、金融工具、平台账户、门店与订单集中管理</p></div><a class="admin-link" href="/admin.html">返回后台</a></div><div id="login" class="toolbar"><input id="token" type="password" placeholder="输入 ADMIN_TOKEN"><button id="open">打开企业档案</button></div><div id="message"></div><div id="content" hidden>
<nav class="tabs"><a href="#overview">主体信息</a><a href="#payments">支付与账户</a><a href="#stores">门店与收款码</a><a href="#orders">订单</a></nav>
<section id="overview" class="profile-layout section"><div><h2>营业执照（脱敏预览）</h2><img id="license" class="license" alt="脱敏营业执照"></div><div><h2>企业基本资料</h2><form id="profileForm" class="profile-grid"><label>公司全称<input name="legalName"></label><label>企业简称<input name="shortName"></label><label>企业类型<input name="entityType"></label><label>注册资本<input name="registeredCapital"></label><label>成立日期<input name="establishedDate" type="date"></label><label>法定代表人（掩码）<input name="legalRepresentativeMasked"></label><label>统一信用代码（掩码）<input name="creditCodeMasked"></label><label>注册地址（掩码）<input name="registeredAddressMasked"></label><label>登记机关<input name="registrationAuthority"></label><label>档案状态<select name="status"><option value="active">正常</option><option value="draft">待完善</option><option value="disabled">停用</option></select></label><label class="full">经营范围<textarea name="businessScope" rows="6"></textarea></label><button class="full">保存企业资料</button></form></div></section>
<section id="payments" class="section"><h2>支付渠道与企业资产</h2><p class="muted">只记录名称、尾号、币种和状态；禁止保存密码、验证码、私钥、助记词或完整卡号。</p><form id="assetForm" class="grid"><label>类型<select name="category"><option value="alipay">支付宝</option><option value="wechat">微信支付</option><option value="bank_card">企业银行卡</option><option value="virtual_card">虚拟卡</option><option value="platform">虚拟平台</option><option value="wallet">钱包</option></select></label><label>名称<input name="label" required placeholder="例如：企业支付宝"></label><label>服务商<input name="provider" placeholder="支付宝/微信/ABA/PayPal"></label><label>账户掩码<input name="accountMask" placeholder="例如：**** 1234"></label><label>币种<input name="currency" placeholder="CNY/USD"></label><label>状态<select name="status"><option value="active">已启用</option><option value="pending">待配置</option><option value="disabled">已停用</option></select></label><label>后台地址<input name="portalUrl" type="url" placeholder="https://"></label><label>备注<input name="notes"></label><button>添加账户</button></form><div id="assets"></div></section>
<section id="stores" class="section"><h2>门店与收款入口</h2><div id="storeList"></div></section><section id="orders" class="section"><h2>企业订单</h2><div id="orderList"></div></section></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const brandId=new URLSearchParams(location.search).get('brand_id');let company;function auth(){return {authorization:'Bearer '+$('token').value,'content-type':'application/json'}}
function table(rows,headers,render){return `<table><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(render).join('')}</table>`}
function render(){const p=company.profile||{};$('title').textContent=p.legalName||company.brand.name;$('license').src=p.licenseImage||'';$('license').hidden=!p.licenseImage;for(const e of $('profileForm').elements)if(e.name)e.value=p[e.name]||'';const names={alipay:'支付宝',wechat:'微信支付',bank_card:'企业银行卡',virtual_card:'虚拟卡',platform:'虚拟平台',wallet:'钱包'};$('assets').innerHTML=table(company.assets,['类型','名称','服务商','账户','币种','状态'],a=>`<tr><td>${esc(names[a.category]||a.category)}</td><td>${esc(a.label)}</td><td>${esc(a.provider||'-')}</td><td>${esc(a.accountMask||'-')}</td><td>${esc(a.currency||'-')}</td><td><span class="status">${esc(a.status)}</span></td></tr>`);$('storeList').innerHTML=table(company.stores,['门店','收款入口'],s=>`<tr><td>${esc(s.name)}</td><td>${company.collectionCodes.filter(c=>c.storeId===s.id).map(c=>`<a href="/?collection_code=${encodeURIComponent(c.id)}" target="_blank">${esc(c.name)}</a>`).join('、')||'-'}</td></tr>`);$('orderList').innerHTML=table(company.orders,['订单','门店','渠道','金额','状态','时间'],o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.storeName||'-')}</td><td>${esc(o.provider)}/${esc(o.channel)}</td><td>¥${(o.amountFen/100).toFixed(2)}</td><td><span class="status">${esc(o.status)}</span></td><td>${esc(o.createdAt)}</td></tr>`);$('content').hidden=false;$('login').hidden=true}
async function load(){if(!brandId)throw new Error('缺少企业编号');const r=await fetch('/api/admin/companies/'+encodeURIComponent(brandId),{headers:auth()});const j=await r.json();if(!j.company)throw new Error(j.error||'读取失败');company=j.company;sessionStorage.setItem('yuanpayAdminToken',$('token').value);render()}
$('token').value=sessionStorage.getItem('yuanpayAdminToken')||'';$('open').onclick=()=>load().catch(e=>$('message').innerHTML=`<div class="result error">${esc(e.message)}</div>`);if($('token').value&&brandId)load().catch(()=>{});
$('profileForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/admin/companies/'+encodeURIComponent(brandId),{method:'PUT',headers:auth(),body:JSON.stringify(body)});const j=await r.json();if(!j.ok)return alert(j.error);$('message').innerHTML='<div class="result">企业资料已保存</div>';await load()};
$('assetForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/admin/companies/'+encodeURIComponent(brandId)+'/assets',{method:'POST',headers:auth(),body:JSON.stringify(body)});const j=await r.json();if(!j.ok)return alert(j.error);e.currentTarget.reset();await load()};
</script></body></html>
