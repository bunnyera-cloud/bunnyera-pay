<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BunnyEra Pay 聚合收银台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui.css"></head>
<body><main class="wrap"><section class="card"><div class="heading"><div><span class="pill">BUNNYERA PAY</span><h1>中国聚合收银台</h1></div><div><a class="admin-link" href="/merchant-register.html">企业入驻</a> <a class="admin-link" href="/login.html">管理后台</a></div></div><p class="muted">支付宝、微信支付、银联/云闪付统一订单入口。资金由对应持牌支付机构直接结算至商户账户。</p><div id="channels" class="result">正在检查支付渠道…</div><form id="pay"><div class="grid"><div><label>收款主体</label><select name="brandId" id="brand" required></select></div><div><label>门店</label><select name="storeId" id="store" required></select></div><div><label>收款码/收银台</label><select name="collectionCodeId" id="collectionCode"><option value="">线上收银台</option></select></div><div><label>商品/服务名称</label><input name="subject" maxlength="80" required value="商品销售"></div><div><label>金额（人民币元）</label><input name="amount" type="number" min="0.01" max="50000" step="0.01" required value="0.10"></div><div><label>支付渠道</label><select name="provider"><option value="alipay">支付宝</option><option value="wechat">微信支付</option><option value="unionpay">银联/云闪付</option></select></div><div><label>支付场景</label><select name="channel"><option value="qr">扫码支付</option><option value="h5">手机 H5 支付</option><option value="web">电脑网页支付</option></select></div></div><p><button>生成付款订单</button></p></form><div id="result"></div></section></main><script src="/app.js"></script></body></html>
