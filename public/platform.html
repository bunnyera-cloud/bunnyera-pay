<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台控制台 · BunnyEra Pay</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui.css"></head><body><main class="wrap wide"><section class="card"><div class="heading"><div><span class="pill">BUNNYERA PAY · PLATFORM</span><h1>多商户支付管理平台</h1><p class="muted">BUNNYERA LLC 提供软件服务；客户货款由持牌支付机构直接结算至各入驻商户。</p></div><div><a class="admin-link" href="/merchant-register.html">商户注册</a> <a class="admin-link" href="/admin.html">商户业务后台</a> <a class="admin-link" href="/login.html">退出</a></div></div><div class="toolbar section"><div><label>平台管理员令牌</label><input id="token" type="password" placeholder="输入 ADMIN_TOKEN"></div><button id="load">打开平台控制台</button></div><div id="message"></div><div id="content" hidden><section class="metrics" id="metrics"></section><nav class="tabs"><a href="#applications">入驻审核</a><a href="#merchants">商户</a><a href="#operations">商户运营</a><a href="#audit">审计日志</a></nav><section id="applications" class="section"><h2>商户入驻审核</h2><div id="applicationList"></div></section><section id="merchants" class="section"><h2>入驻商户</h2><div id="merchantList"></div></section><section id="operations" class="section"><h2>部门、产品与员工</h2><div class="grid"><form id="departmentForm"><label>商户<select name="merchantId" class="merchantSelect"></select></label><label>部门编号<input name="code" placeholder="01"></label><label>部门名称<input name="name" required placeholder="例如：零售一部"></label><button>新增部门</button></form><form id="productForm"><label>商户<select name="merchantId" class="merchantSelect"></select></label><label>所属部门<select name="departmentId" id="productDepartment"></select></label><label>产品名称<input name="name" required></label><label>SKU<input name="sku"></label><label>金额（元）<input name="price" type="number" min="0" step="0.01" required></label><label>币种<select name="currency"><option>CNY</option><option>USD</option></select></label><button>新增产品</button></form><form id="memberForm"><label>商户<select name="merchantId" class="merchantSelect"></select></label><label>所属部门<select name="departmentId" id="memberDepartment"></select></label><label>姓名<input name="name" required></label><label>邮箱<input name="email" type="email" required></label><label>角色<select name="role"><option value="merchant_admin">商户管理员</option><option value="finance">财务</option><option value="operator">运营</option><option value="staff">店员</option><option value="auditor">审计只读</option></select></label><button>邀请员工</button></form></div><div id="resourceList"></div></section><section id="audit" class="section"><h2>审计日志</h2><div id="auditList"></div></section></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));let state;const auth=()=>({authorization:'Bearer '+$('token').value,'content-type':'application/json'});const table=(rows,heads,fn)=>`<table><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(fn).join('')}</table>`;
function render(){const pending=state.applications.filter(x=>x.status==='submitted').length;$('metrics').innerHTML=`<article><b>${state.merchants.length}</b><span>入驻商户</span></article><article><b>${pending}</b><span>待审核</span></article><article><b>${state.departments.length}</b><span>部门</span></article><article><b>${state.products.length}</b><span>产品</span></article>`;$('applicationList').innerHTML=table(state.applications,['企业','地区','联系人','状态','操作'],a=>`<tr><td>${esc(a.legalName)}<br><small>${esc(a.registrationNumberMasked)}</small></td><td>${esc(a.country)}</td><td>${esc(a.contactName)}<br>${esc(a.contactEmail)}</td><td><span class="status">${esc(a.status)}</span></td><td>${a.status==='submitted'?`<button class="mini approve" data-id="${a.id}">批准</button><button class="mini danger reject" data-id="${a.id}">拒绝</button>`:'-'}</td></tr>`);$('merchantList').innerHTML=table(state.merchants,['企业主体','地区','验证','状态','支付边界'],m=>`<tr><td>${esc(m.legalName)}</td><td>${esc(m.country)}</td><td>${esc(m.verificationStatus)}</td><td><span class="status">${esc(m.status)}</span></td><td>商户自有账户直连</td></tr>`);const options=state.merchants.map(m=>`<option value="${m.id}">${esc(m.legalName)}</option>`).join('');document.querySelectorAll('.merchantSelect').forEach(x=>x.innerHTML=options);fillDepartments();$('resourceList').innerHTML='<h3>部门</h3>'+table(state.departments,['商户','编号','名称','状态'],d=>`<tr><td>${merchantName(d.merchantId)}</td><td>${esc(d.code||'-')}</td><td>${esc(d.name)}</td><td>${esc(d.status)}</td></tr>` )+'<h3>产品</h3>'+table(state.products,['商户','产品','SKU','金额'],p=>`<tr><td>${merchantName(p.merchantId)}</td><td>${esc(p.name)}</td><td>${esc(p.sku||'-')}</td><td>${esc(p.currency)} ${(p.priceFen/100).toFixed(2)}</td></tr>` )+'<h3>员工</h3>'+table(state.members,['商户','姓名','邮箱','角色','状态'],m=>`<tr><td>${merchantName(m.merchantId)}</td><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${esc(m.role)}</td><td>${esc(m.status)}</td></tr>`);$('auditList').innerHTML=table(state.auditLogs.slice(0,100),['动作','商户','详情','时间'],a=>`<tr><td>${esc(a.action)}</td><td>${merchantName(a.merchantId)}</td><td>${esc(a.detail)}</td><td>${esc(a.createdAt)}</td></tr>`);document.querySelectorAll('.approve').forEach(b=>b.onclick=()=>review(b.dataset.id,'approve'));document.querySelectorAll('.reject').forEach(b=>b.onclick=()=>review(b.dataset.id,'reject'))}
const merchantName=id=>esc(state.merchants.find(x=>x.id===id)?.legalName||'-');function fillDepartments(){const merchantId=document.querySelector('#productForm .merchantSelect').value;const options='<option value="">未分配</option>'+state.departments.filter(x=>x.merchantId===merchantId).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');$('productDepartment').innerHTML=options;$('memberDepartment').innerHTML=options}
async function load(){const r=await fetch('/api/admin/platform',{headers:auth()}),j=await r.json();if(!j.data)throw new Error('令牌错误或读取失败');state=j.data;sessionStorage.setItem('bunnyeraPlatformToken',$('token').value);$('content').hidden=false;render()}async function review(id,action){if(action==='reject'&&!confirm('确认拒绝这项申请？'))return;await fetch(`/api/admin/applications/${id}/${action}`,{method:'POST',headers:auth(),body:'{}'});await load()}async function create(type,form){const d=Object.fromEntries(new FormData(form)),merchantId=d.merchantId;delete d.merchantId;if(type==='products'){d.priceFen=Math.round(Number(d.price)*100);delete d.price}const r=await fetch(`/api/admin/merchants/${merchantId}/${type}`,{method:'POST',headers:auth(),body:JSON.stringify(d)}),j=await r.json();if(!j.ok)throw new Error(j.error);form.reset();await load()}
$('token').value=sessionStorage.getItem('bunnyeraPlatformToken')||'';$('load').onclick=()=>load().catch(e=>$('message').innerHTML=`<div class="result error">${esc(e.message)}</div>`);$('departmentForm').onsubmit=e=>{e.preventDefault();create('departments',e.currentTarget).catch(e=>alert(e.message))};$('productForm').onsubmit=e=>{e.preventDefault();create('products',e.currentTarget).catch(e=>alert(e.message))};$('memberForm').onsubmit=e=>{e.preventDefault();create('members',e.currentTarget).catch(e=>alert(e.message))};document.querySelector('#productForm .merchantSelect').onchange=fillDepartments;if($('token').value)load().catch(()=>{});
</script></body></html>
