<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球商户注册 · BunnyEra Pay</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui.css"><style>.register-hero{display:flex;justify-content:space-between;gap:20px;align-items:start}.stepbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0}.stepbar span{padding:11px;border-radius:9px;background:#eef3f9;color:#64748b;font-size:12px;text-align:center}.stepbar span:first-child{background:#e8f1ff;color:#185bd4;font-weight:700}.register-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.register-grid .full{grid-column:1/-1}.phone-row{display:grid;grid-template-columns:145px 1fr;gap:10px}.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.doc-card{border:1px dashed #b8c6d9;border-radius:13px;padding:16px;background:#f9fbfe}.doc-card b,.doc-card small{display:block}.doc-card small{color:#718096;margin:7px 0 12px;line-height:1.5}.doc-card input{font-size:12px;padding:10px;background:#fff}.file-state{margin-top:8px;color:#2563eb;font-size:12px}.submit-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.submit-row button{width:min(360px,100%)}@media(max-width:760px){.register-grid,.doc-grid{grid-template-columns:1fr}.register-grid .full{grid-column:auto}.register-hero,.submit-row{display:block}.submit-row button{margin-top:16px}.stepbar{grid-template-columns:1fr}.phone-row{grid-template-columns:120px 1fr}}</style></head><body><main class="wrap"><section class="card"><div class="register-hero"><div><span class="pill">BUNNYERA PAY · GLOBAL MERCHANT ONBOARDING</span><h1>全球企业商户注册</h1><p class="muted">面向亚太及东南亚企业。请按企业注册证照填写，资料将用于主体审核和支付渠道申请。</p></div><a class="admin-link" href="/login.html">返回登录</a></div><div class="stepbar"><span>1. 企业资料</span><span>2. 经营场景证明</span><span>3. 提交平台审核</span></div><form id="register" class="register-grid"><label>企业全称<input name="legalName" required maxlength="160" placeholder="接受中文或英文大写，与注册证照完全一致"></label><label>注册国家/地区<select name="country" id="country" required></select></label><label>企业注册号 / 统一社会信用代码<input name="registrationNumberMasked" required maxlength="80" placeholder="填写营业执照或公司注册证书上的登记号码"></label><label>法人 / 法定代表人<input name="legalRepresentative" required maxlength="100" placeholder="与企业注册证照一致"></label><label>联系邮箱<input name="contactEmail" type="email" required maxlength="120" placeholder="name@gmail.com 或 name@company.com"></label><label>联系电话<div class="phone-row"><select name="dialCode" id="dialCode" required></select><input name="phoneNumber" type="tel" required maxlength="30" placeholder="手机或企业联系电话"></div></label><label>经营类别<input name="businessCategory" required maxlength="120" placeholder="例如：服装零售、软件服务、跨境电商"></label><label>企业网站（选填）<input name="website" type="url" placeholder="https://"></label><section class="full"><h2>经营资质与场景照片</h2><p class="muted">支持 JPG、PNG、WebP，单张不超过 5MB。照片应清晰、真实、无遮挡。</p><div class="doc-grid"><label class="doc-card"><b>营业执照 / 公司注册证书</b><small>完整拍摄证照四角，文字和登记号码清晰可见。</small><input type="file" data-kind="license" accept="image/jpeg,image/png,image/webp" required><span class="file-state">尚未选择</span></label><label class="doc-card"><b>门头照片</b><small>展示店铺招牌、入口和实际经营场所外观。</small><input type="file" data-kind="storefront" accept="image/jpeg,image/png,image/webp" required><span class="file-state">尚未选择</span></label><label class="doc-card"><b>室内经营场景</b><small>展示商品、办公区域、货架或服务场景。</small><input type="file" data-kind="interior" accept="image/jpeg,image/png,image/webp" required><span class="file-state">尚未选择</span></label></div></section><label class="full consent"><input type="checkbox" required> 我确认提交资料真实、有效，并获得授权用于企业身份审核和支付渠道申请。我不会提交账户密码、验证码、私钥或完整银行卡资料。</label><div class="full submit-row"><p class="muted">提交后状态为“待审核”，不代表支付渠道已经开通。</p><button id="submit">上传资料并提交审核</button></div></form><div id="message"></div></section></main><script>
const regions=[['CN','中国大陆','+86'],['HK','中国香港','+852'],['MO','中国澳门','+853'],['TW','中国台湾','+886'],['SG','新加坡','+65'],['MY','马来西亚','+60'],['TH','泰国','+66'],['VN','越南','+84'],['ID','印度尼西亚','+62'],['PH','菲律宾','+63'],['BN','文莱','+673'],['KH','柬埔寨','+855'],['LA','老挝','+856'],['MM','缅甸','+95'],['TL','东帝汶','+670'],['JP','日本','+81'],['KR','韩国','+82'],['IN','印度','+91'],['PK','巴基斯坦','+92'],['BD','孟加拉国','+880'],['LK','斯里兰卡','+94'],['NP','尼泊尔','+977'],['MV','马尔代夫','+960'],['MN','蒙古','+976'],['AU','澳大利亚','+61'],['NZ','新西兰','+64'],['FJ','斐济','+679'],['PG','巴布亚新几内亚','+675'],['AE','阿联酋','+971'],['SA','沙特阿拉伯','+966'],['QA','卡塔尔','+974'],['KW','科威特','+965'],['BH','巴林','+973'],['OM','阿曼','+968'],['US','美国','+1'],['GB','英国','+44'],['CA','加拿大','+1']];
const country=document.querySelector('#country'),dial=document.querySelector('#dialCode'),form=document.querySelector('#register'),message=document.querySelector('#message'),submit=document.querySelector('#submit');country.innerHTML=regions.map(x=>`<option value="${x[0]}">${x[1]} (${x[0]})</option>`).join('');function syncDial(){const code=regions.find(x=>x[0]===country.value)?.[2]||'';dial.innerHTML=regions.map(x=>`<option value="${x[2]}" ${x[2]===code?'selected':''}>${x[2]} ${x[1]}</option>`).join('')}country.onchange=syncDial;syncDial();document.querySelectorAll('input[type=file]').forEach(input=>input.onchange=()=>{const f=input.files[0];input.nextElementSibling.textContent=f?`${f.name} · ${(f.size/1048576).toFixed(1)}MB`:'尚未选择'});
async function upload(input){const f=input.files[0];if(!f)throw Error('请上传全部三张照片');if(f.size>5*1024*1024)throw Error(`${f.name} 超过 5MB`);const r=await fetch('/api/merchant-application-assets',{method:'POST',headers:{'content-type':f.type,'x-document-kind':input.dataset.kind},body:f});const j=await r.json();if(!r.ok)throw Error(j.error||'图片上传失败');return j.asset}
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;message.innerHTML='<div class="result">正在安全上传并提交资料…</div>';try{const documents=[];for(const input of document.querySelectorAll('input[type=file]'))documents.push(await upload(input));const data=Object.fromEntries(new FormData(form));data.documents=documents;const r=await fetch('/api/merchant-applications',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'提交失败');form.reset();syncDial();message.innerHTML=`<div class="result">提交成功。申请编号：<b>${j.application.id}</b>，请保存此编号。</div>`}catch(err){message.innerHTML=`<div class="result error">${err.message}</div>`}finally{submit.disabled=false}};
</script></body></html>
