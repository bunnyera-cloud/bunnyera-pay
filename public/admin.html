<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BunnyEra Pay 商户业务后台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui.css"></head><body><main class="wrap"><section class="card"><div class="heading"><div><span class="pill">BUNNYERA PAY · OPERATIONS</span><h1>商户业务后台</h1></div><div><a class="admin-link" href="/platform.html">平台控制台</a> <a class="admin-link" href="/">返回收银台</a></div></div><div class="toolbar"><div><label>后台令牌</label><input id="token" type="password" placeholder="输入 ADMIN_TOKEN"></div><button id="load">读取数据</button></div><div id="message"></div><section class="section"><h2>主体、门店与收款码</h2><div class="grid"><div><label>新主体名称</label><input id="brandName" placeholder="例如：品牌 A"><button id="addBrand">新增品牌</button></div><div><label>所属主体</label><select id="storeBrand"></select><label>新门店名称</label><input id="storeName" placeholder="例如：西湖店"><button id="addStore">新增门店</button></div><div><label>所属门店</label><select id="codeStore"></select><label>收银台名称</label><input id="codeName" placeholder="例如：一号收银台"><button id="addCode">生成收款入口</button></div></div><div id="catalog"></div></section><section class="section"><h2>统一订单对账</h2><div id="orders"></div></section></section></main><script>
const $=id=>document.getElementById(id);let state={brands:[],stores:[],collectionCodes:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const auth=()=>({authorization:'Bearer '+$('token').value,'content-type':'application/json'});function selects(){$('storeBrand').innerHTML=state.brands.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('codeStore').innerHTML=state.stores.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
function catalogView(){selects();const companies='<h3>企业主体档案</h3><table><tr><th>企业主体</th><th>独立管理页面</th></tr>'+state.brands.map(b=>`<tr><td>${esc(b.name)}</td><td><a href="/company.html?brand_id=${encodeURIComponent(b.id)}">打开企业档案</a></td></tr>`).join('')+'</table>';const counters='<h3>门店收款入口</h3><table><tr><th>主体</th><th>门店</th><th>收款入口</th><th>客户链接</th></tr>'+state.collectionCodes.map(c=>{const s=state.stores.find(x=>x.id===c.storeId)||{};const b=state.brands.find(x=>x.id===s.brandId)||{};const link=location.origin+'/?collection_code='+encodeURIComponent(c.id);return `<tr><td>${esc(b.name)}</td><td>${esc(s.name)}</td><td>${esc(c.name)}</td><td><a href="${link}" target="_blank">打开</a></td></tr>`}).join('')+'</table>';$('catalog').innerHTML=companies+counters}
async function loadData(){const [a,b]=await Promise.all([fetch('/api/admin/catalog',{headers:auth()}),fetch('/api/admin/orders',{headers:auth()})]);const cj=await a.json(),oj=await b.json();if(!cj.catalog){$('message').innerHTML='<div class="result error">令牌错误或读取失败</div>';return}state=cj.catalog;catalogView();$('message').innerHTML='<div class="result">数据已更新</div>';$('orders').innerHTML='<table><tr><th>订单</th><th>主体/门店</th><th>渠道</th><th>金额</th><th>状态</th><th>时间</th></tr>'+(oj.orders||[]).map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.brandName||'-')} / ${esc(o.storeName||'-')}</td><td>${esc(o.provider)}/${esc(o.channel)}</td><td>¥${(o.amountFen/100).toFixed(2)}</td><td><span class="status">${esc(o.status)}</span></td><td>${esc(o.createdAt)}</td></tr>`).join('')+'</table>'}
async function create(path,body){const r=await fetch(path,{method:'POST',headers:auth(),body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error||'创建失败');await loadData()}
$('load').onclick=loadData;$('addBrand').onclick=()=>create('/api/admin/brands',{name:$('brandName').value}).catch(e=>alert(e.message));$('addStore').onclick=()=>create('/api/admin/stores',{name:$('storeName').value,brandId:$('storeBrand').value}).catch(e=>alert(e.message));$('addCode').onclick=()=>create('/api/admin/collection-codes',{name:$('codeName').value,storeId:$('codeStore').value}).catch(e=>alert(e.message));
</script></body></html>
