version: '3.8'

# 生产环境 Docker Compose 配置
# 使用方式: docker compose -f docker-compose.prod.yml up -d
# 必须创建 .env 文件并填入所有必要变量

services:
  postgres:
    image: postgres:16-alpine
    container_name: bunnyera-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bunnyera_pay}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: bunnyera-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunnyera-pay-app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-bunnyera_pay}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PAYMENT_ENV: ${PAYMENT_ENV}
      APP_BASE_URL: ${APP_BASE_URL}
      PAYMENT_CONFIG_ENCRYPTION_KEY: ${PAYMENT_CONFIG_ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-BunnyEra Pay}
      NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PLATFORM_PUBLIC_KEY: ${ALIPAY_PLATFORM_PUBLIC_KEY}
      ALIPAY_PLATFORM_CERTIFICATE: ${ALIPAY_PLATFORM_CERTIFICATE}
      ALIPAY_APP_CERT_SN: ${ALIPAY_APP_CERT_SN}
      ALIPAY_ROOT_CERT_SN: ${ALIPAY_ROOT_CERT_SN}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY}
      WECHAT_KEY_PATH: ${WECHAT_KEY_PATH}
      WECHAT_SERIAL_NO: ${WECHAT_SERIAL_NO}
      WECHAT_PLATFORM_PUBLIC_KEY: ${WECHAT_PLATFORM_PUBLIC_KEY}
      WECHAT_PLATFORM_CERT_PATH: ${WECHAT_PLATFORM_CERT_PATH}
      WECHAT_PLATFORM_SERIAL_NO: ${WECHAT_PLATFORM_SERIAL_NO}
      UNIONPAY_MER_ID: ${UNIONPAY_MER_ID}
      UNIONPAY_SIGN_CERT_PATH: ${UNIONPAY_SIGN_CERT_PATH}
      UNIONPAY_SIGN_CERT_PASSWORD: ${UNIONPAY_SIGN_CERT_PASSWORD}
      UNIONPAY_VERIFY_CERTIFICATE: ${UNIONPAY_VERIFY_CERTIFICATE}
      UNIONPAY_VERIFY_CERT_PATH: ${UNIONPAY_VERIFY_CERT_PATH}
      UNIONPAY_TERM_ID: ${UNIONPAY_TERM_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
