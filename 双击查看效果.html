<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人民币支付系统预览</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#101828;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.brand{font-weight:800;font-size:20px}.badge{font-size:12px;background:#174ea6;padding:6px 10px;border-radius:99px}.wrap{max-width:1040px;margin:38px auto;padding:0 20px}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:26px;box-shadow:0 14px 40px #16203210}h1{margin:4px 0 8px;font-size:27px}h2{font-size:18px}.muted{color:#687386;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:22px}label{font-size:13px;color:#536071;display:block;margin-bottom:7px}input,select,button{width:100%;padding:13px;border:1px solid #cfd6e2;border-radius:10px;font:inherit}button{border:0;color:#fff;background:#1677ff;font-weight:800;cursor:pointer;margin-top:18px}.channels{display:flex;gap:10px;margin-top:16px}.channel{flex:1;padding:14px;border:2px solid #e3e7ee;border-radius:12px;text-align:center;cursor:pointer}.channel.on{border-color:#1677ff;background:#f0f7ff}.green.on{border-color:#07c160;background:#effcf5}.price{font-size:38px;font-weight:900;margin:17px 0}.status{padding:12px;background:#f7f9fc;border-radius:10px;margin:10px 0}.orders{margin-top:22px}.row{display:grid;grid-template-columns:1.4fr 1fr .8fr;gap:8px;border-top:1px solid #edf0f4;padding:12px 0;font-size:13px}.success{color:#07883f;font-weight:700}.notice{margin-top:16px;padding:12px;background:#fff8e7;border:1px solid #f5df9b;border-radius:10px;font-size:13px;color:#765d14}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{padding:0 20px}}
</style></head><body><header class="top"><div class="brand">人民币统一支付中心</div><div class="badge">本地效果预览 · 不会扣款</div></header><main class="wrap"><div class="layout"><section class="card"><h1>创建付款订单</h1><p class="muted">电脑网站支付、手机网站支付和后台开单界面预览。</p><div class="grid"><div><label>商品或服务</label><input id="subject" value="软件技术服务"></div><div><label>金额（人民币）</label><input id="amount" type="number" min="0.01" step="0.01" value="1.00"></div></div><label style="margin-top:18px">选择支付渠道</label><div class="channels"><div id="alipay" class="channel on" onclick="choose('alipay')">🔵 支付宝<br><small>电脑/H5</small></div><div id="wechat" class="channel green" onclick="choose('wechat')">🟢 微信支付<br><small>经营码/API</small></div></div><button onclick="createOrder()">生成模拟付款订单</button><div class="notice">这是无需安装的界面预览。支付宝官方沙箱和微信真实支付仍需商户后台授权与参数。</div></section><aside class="card"><p class="muted">当前订单</p><div class="price" id="price">¥1.00</div><div class="status">状态：<span id="state">等待创建</span></div><div class="status">渠道：<span id="provider">支付宝</span></div><button id="paid" style="background:#07c160;display:none" onclick="markPaid()">模拟支付成功</button></aside></div><section class="card orders"><h2>后台订单记录</h2><div class="row"><b>订单号</b><b>渠道/金额</b><b>状态</b></div><div id="rows"><p class="muted">尚无订单</p></div></section></main><script>
let selected='alipay',current=null,orders=[];function choose(v){selected=v;alipay.classList.toggle('on',v==='alipay');wechat.classList.toggle('on',v==='wechat');provider.textContent=v==='alipay'?'支付宝':'微信支付'}function createOrder(){const n=Number(amount.value);if(!subject.value.trim()||!n||n<=0){alert('请填写商品名称和正确金额');return}current={id:'YP'+Date.now(),subject:subject.value.trim(),amount:n,provider:selected,status:'待支付'};orders.unshift(current);price.textContent='¥'+n.toFixed(2);state.textContent='待支付';paid.style.display='block';render()}function markPaid(){if(!current)return;current.status='支付成功';state.textContent='支付成功';paid.style.display='none';render()}function render(){rows.innerHTML=orders.map(o=>`<div class="row"><span>${o.id}<br><small>${o.subject}</small></span><span>${o.provider==='alipay'?'支付宝':'微信'} / ¥${o.amount.toFixed(2)}</span><span class="${o.status==='支付成功'?'success':''}">${o.status}</span></div>`).join('')||'<p class="muted">尚无订单</p>'}amount.oninput=()=>price.textContent='¥'+(Number(amount.value)||0).toFixed(2);
</script></body></html>
